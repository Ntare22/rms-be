services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rms}
      POSTGRES_USER: ${POSTGRES_USER:-rms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rms_pg_data:
