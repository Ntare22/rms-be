  /api/v1/organizations/{id}/leases:
    get:
      description: Organization-scoped list with **pagination** (`page`, `page_size`,
        max 100). **Filters:** `status`, `building_id` (via unit), `unit_id`, `tenant_id`,
        `active_on` (date `YYYY-MM-DD` — leases **active** for any time on that UTC
        calendar day). **Overlap rule:** creating/updating an **active + primary**
        lease is rejected if its `[start_date,end_date)` range intersects another
        active primary lease on the same unit (mirrors DB EXCLUDE constraint).
      parameters:
      - description: Organization ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page (1-based)
        example: 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size
        example: 20
        in: query
        maximum: 100
        name: page_size
        type: integer
      - description: draft | active | ended | cancelled
        example: active
        in: query
        name: status
        type: string
      - description: Filter by building (units in this building)
        format: uuid
        in: query
        name: building_id
        type: string
      - description: Filter by unit
        format: uuid
        in: query
        name: unit_id
        type: string
      - description: Filter by tenant
        format: uuid
        in: query
        name: tenant_id
        type: string
      - description: Date YYYY-MM-DD (UTC day) when lease must be active
        example: "2026-04-18"
        in: query
        name: active_on
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-leases_LeaseListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: List leases
      tags:
      - leases
    post:
      consumes:
      - application/json
      description: '**Draft** is allowed. **Active + primary** leases cannot overlap
        in time on the same unit (enforced here and by SQL EXCLUDE). Tenant and unit
        must belong to the organization. When `status` is **active**, the unit becomes
        **occupied** if at least one active lease exists. **Audit:** `lease.created`
        is recorded.'
      parameters:
      - description: Organization ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: 'Example: {\'
        in: body
        name: body
