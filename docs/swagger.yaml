  /api/v1/organizations/{id}/tenants:
    get:
      description: '**Nested route:** `/api/v1/organizations/{id}/tenants`. **Admin:**
        any org `id`. **Landlord, manager, staff:** own organization only. **Pagination:**
        `page`, `page_size` (max 100). **Search (AND):** optional `name`, `email`,
        `phone` query params — each matches case-insensitively (`ILIKE`) against name
        fields or email/phone respectively. Optional `status` filter (`active`, `inactive`,
        `archived`). Set `include_summary=true` to add `active_lease_count` and `current_unit`
        (from the latest active lease) per tenant.'
      parameters:
      - description: Organization ID (Gin param name `id`)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page (1-based)
        example: 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size
        example: 20
        in: query
        maximum: 100
        name: page_size
        type: integer
      - description: Search by first/last/full name (partial)
        example: Jordan
        in: query
        name: name
        type: string
      - description: Search by email (partial)
        example: lee@
        in: query
        name: email
        type: string
      - description: Search by phone (partial)
        example: "555"
        in: query
        name: phone
        type: string
      - description: Filter by tenant status
        example: active
        in: query
        name: status
        type: string
      - description: true/1/yes to include lease summary fields
        example: "true"
        in: query
        name: include_summary
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Example item: full_name, email_opt_in, active_lease_count
            when include_summary=true'
          schema:
            $ref: '#/definitions/response.Envelope-tenants_TenantListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: List tenants
      tags:
      - tenants
    post:
      consumes:
      - application/json
      description: '**Admin / landlord / manager** only. Validates `email` format
        when provided; `phone` max length 32. If `full_name` is omitted it is derived
        from first + last name. Default `status` is `active`.'
      parameters:
      - description: Organization ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: 'Example: {\'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tenants.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope-tenants_TenantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create tenant
      tags:
      - tenants
  /api/v1/organizations/{id}/tenants/{tenantId}:
    delete:
      description: '**Soft-delete** only when the tenant has **no** lease rows (any
        status). If leases exist, returns **409** `tenant_has_leases` — keep the record
        and **PATCH** `status` to `inactive` or `archived` instead. **Admin / landlord
        / manager** only.'
      parameters:
      - description: Organization ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Tenant ID
        format: uuid
        in: path
        name: tenantId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: tenant_has_leases
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete tenant
      tags:
      - tenants
    get:
      description: Returns a tenant scoped to the organization. Optional `include_summary=true`
        adds `active_lease_count` and `current_unit` from active leases.
      parameters:
      - description: Organization ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Tenant ID
        format: uuid
        in: path
        name: tenantId
        required: true
        type: string
      - description: true/1/yes for lease summary
        example: "true"
        in: query
        name: include_summary
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-tenants_TenantResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get tenant
      tags:
      - tenants
    patch:
      consumes:
      - application/json
      description: '**Preferred lifecycle:** set `status` to `inactive` or `archived`
        instead of deleting when the tenant has lease history. Partial updates supported.
        Recomputes `full_name` when `first_name` or `last_name` changes unless `full_name`
        is sent explicitly.'
      parameters:
      - description: Organization ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Tenant ID
        format: uuid
        in: path
        name: tenantId
        required: true
        type: string
      - description: 'Example: {\'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tenants.PatchTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope-tenants_TenantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update tenant
      tags:
      - tenants
  /api/v1/organizations/{id}/users:
    get:
      description: '**Admin:** any organization `id`. **Landlord / manager:** only
        users in their own organization (`id` must match the token). **Staff** is
        not allowed. Paginated with `page` and `page_size` (max 100).'
